<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="fonts.css">
        <title>Ejercicio 3 - Tablas HTML</title>
        <style>
            body {
                font-family: Montserrat,Arial, sans-serif;
                background: linear-gradient(135deg, #d7e9ff, #fff1e6, #e9ddff);
                padding: 40px 20px;
                text-align: center;
                margin: 0;
                min-height: 100vh;
                box-sizing: border-box;
            }
            table {
                width: 80%;
                max-width: 600px;
                margin: 20px auto;
                border-collapse: collapse;
                background: white;
                box-shadow: 0 2px 8px rgba(0,0,0,0.1);
                border-radius: 10px;
                overflow: hidden;
            }
            th, td {
                border: 1px solid #ddd;
                padding: 12px;
                text-align: left;
            }
            th {
                background-color: #003366;
                color: white;
            }
            tr:nth-child(even) { background-color: #f8f9fa; }
            tbody tr:hover {
                background-color: #dbeafe;
                transition: background-color 0.3s ease;
            }
            a {
                color: #0891b2;
                text-decoration: none;
                transition: color 0.3s ease;
            }
            a:hover {
                color: #7c3aed;
                text-decoration: underline;
            }
        </style>
    </head>
<body>
    <h2>Lista de Países y Capitales</h2>
    <table>
        <thead>
            <tr>
                <th>N°</th>
                <th>País</th>
                <th>Capital</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td>Ecuador</td>
                <td>Quito</td>
            </tr>
            <tr>
                <td>2</td>
                <td>Perú</td>
                <td>Lima</td>
            </tr>
            <tr>
                <td>3</td>
                <td>Colombia</td>
                <td>Bogotá</td>
            </tr>
        </tbody>
    </table>
    <br>
    <a href="index.html">&larr; Volver al Menú Principal</a>
</body>
</html>
