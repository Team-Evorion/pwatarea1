<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="fonts.css">
    <title>Ejercicio 6 - Diseño de Caja</title>
    <style>
        body {
            font-family: Montserrat,Arial, sans-serif;
            text-align: center;
            margin: 0;
            min-height: 100vh;
            padding: 40px;
            box-sizing: border-box;
            background:
                radial-gradient(circle at 15% 20%, #b8a6ff 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, #f9b4dd 0%, transparent 40%),
                linear-gradient(135deg, #e8ddff, #fdf2ff, #d8c9ff);
            background-attachment: fixed;
            }

        .caja {
            background: linear-gradient(135deg, #e3f2fd, #90caf9, #64b5f6);
            border: 3px solid #2471a3;
            border-radius: 15px;
            max-width: 450px;
            margin: 30px auto;
            padding: 30px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(36, 113, 163, 0.25);
        }

        .slider {
            width: 80%;
            accent-color: #2563eb;
            cursor: pointer;
        }

        .slider:hover {
            accent-color: #0ea5e9;
        }

        .slider:active {
            accent-color: #7c3aed;
        }

        .back-link {
            display: inline-block;
            margin: 15px;
            color: #0891b2;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .back-link:hover {
            color: #7c3aed;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h1>Ejercicio 6: Diseño de Caja</h1>

    <div class="caja">
        <h2>Control Deslizante</h2>
        <p>Desliza el control para seleccionar un valor.</p>

        <input class="slider" type="range"
            min="0" max="100" value="50">
    </div>

    <a href="index.html" class="back-link">&longleftarrow; Volver al Menú Principal</a>
</body>
</html>
