<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 9 - Galería de Pasatiempos</title>
    <link rel="stylesheet" href="fonts.css">
    <style>
        body {
            font-family: Montserrat,Arial, sans-serif;
            background: linear-gradient(135deg, #d9f4f1, #e3e8ff, #f3d9ef);
            margin: 0;
            padding: 0;
            text-align: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .gallery {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 20px;
        }
        .gallery img {
            width: 220px;
            height: 150px;
            object-fit: cover;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .gallery img:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
        }

        /* Modal / Ventana emergente */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal img {
            max-width: 80%;
            max-height: 80%;
            border-radius: 8px;
        }
        .close-btn {
            position: absolute;
            top: 20px; right: 30px;
            color: white; font-size: 30px; cursor: pointer;
        }
        a { display: inline-block; margin-top: 25px; color: #0066cc; text-decoration: none; }
    
        .navbar {
            background-color: #003366;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            padding: 10px;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin-top: 0;
            padding: 12px 20px;
            font-weight: bold;
        }

        .navbar a:hover {
            background-color: #14558c;
        }

        .navbar a:active {
            color: #ffcc00;
        }

        .back-link {
            color: #0891b2;
            text-decoration: none;
            transition: color 0.3s ease;
        }

            .back-link:hover {
                color: #7c3aed;
                text-decoration: underline;
        }
    
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="ej05.html#presentacion">Presentación</a>
        <a href="ej05.html#experiencia">Experiencia</a>
        <a href="https://github.com" target="_blank">GitHub</a>
        <a href="https://linkedin.com" target="_blank">LinkedIn</a>
    </nav>

    <h2>Galería de Pasatiempos</h2>
    <p>Haz clic en cualquiera de las imágenes para desplegarla en ventana emergente.</p>

    <div class="gallery">
        <img src="https://picsum.photos/id/0/400/300" alt="Programación" onclick="openModal(this.src)">
        <img src="https://picsum.photos/id/111/400/300" alt="Automóviles clásicos" onclick="openModal(this.src)">
        <img src="https://picsum.photos/id/96/400/300" alt="Videojuegos" onclick="openModal(this.src)">
    </div>

    <!-- Estructura de la ventana emergente -->
    <div id="modalBox" class="modal" onclick="closeModal()">
        <span class="close-btn">&times;</span>
        <img id="modalImg" src="" alt="Ampliación">
    </div>

    <br>
    <a href="index.html" class="back-link">&longleftarrow; Volver al Menú Principal</a>

    <script>
        function openModal(src) {
            document.getElementById('modalImg').src = src;
            document.getElementById('modalBox').style.display = 'flex';
        }
        function closeModal() {
            document.getElementById('modalBox').style.display = 'none';
        }
    </script>
</body>
</html>
