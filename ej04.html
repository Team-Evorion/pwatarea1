<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="fonts.css">
        <title>Ejercicio 4 - Formulario Básico</title>
        <style>
            body {
                font-family: Montserrat,Arial, sans-serif;
                background: linear-gradient(135deg, #d1fae5, #e0f2fe, #ffedd5);
                padding: 40px 20px;
                margin: 0;
                min-height: 100vh;
                box-sizing: border-box;
            }
            .form-box {
                background: #f8fafc;
                max-width: 400px;
                margin: 0 auto;
                padding: 25px;
                border-radius: 8px;
                box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            }
            .form-group {
                margin-bottom: 15px;
            }
            label {
                display: block;
                margin-bottom: 5px; 
                font-weight: bold;
                color: #333;
            }
            input[type="text"],
            input[type="email"],
            input[type="number"] {
                background-color: #eff6ff;
                color: #1e293b;
                width: 100%;
                padding: 10px;
                border: 1px solid #ccc;
                border-radius: 4px;
                box-sizing: border-box;
            }
            .form-group input:focus {
                border-color: #0891b2;
                outline: 2px solid #a78bfa;
            }
            button {
                width: 100%;
                padding: 10px;
                background-color: #28a745;
                color: white;
                border: none;
                border-radius: 4px;
                font-size: 16px;
                cursor: pointer;
                transition: background-color 0.3s ease, transform 0.3s ease;
            }
            button:hover {
                background-color: #218838;
                transform: translateY(-4px);
            }
            .back-btn {
                display: block;
                text-align: center;
                margin-top: 15px;
                color: #0891b2;
                text-decoration: none;
                transition: color 0.3s ease;
            }
            .back-btn:hover {
                color: #7c3aed;
                text-decoration: underline;
            }
        </style>
    </head>
<body>
    <div class="form-box">
        <h2>Registro de Usuario</h2>
        <form onsubmit="alert('¡Formulario validado!'); return false;">
            <div class="form-group">
                <label for="nombre">Nombre Completo:</label>
                <input type="text" id="nombre" name="nombre" required>
            </div>
            <div class="form-group">
                <label for="email">Correo Electrónico:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="edad">Edad:</label>
                <input type="number" id="edad" name="edad" min="18" max="100" required>
            </div>
            <button type="submit">Enviar Datos</button>
        </form>
        <a href="index.html" class="back-btn">&larr; Volver al Menú</a>
    </div>
</body>
</html>
